<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI Agents for Chemistry - nvMolKit Brev launchable architecture</title>
  <desc id="desc">A user goal enters a Jupyter notebook on Brev. A Python controller sends the nvMolKit skill, goal, and structured results to hosted Nemotron. Nemotron returns a plan and bounded tool calls. Python validates and executes five nvMolKit operations on an NVIDIA L4 GPU, with RDKit supporting input preparation and visualization. Structured results and figures produce a schema-checked scientific synthesis.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0b1711" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24332a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2472a4"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b8f18"/>
    </marker>
    <style>
      .title { font: 700 48px Arial, Helvetica, sans-serif; fill: #172019; }
      .subtitle { font: 400 23px Arial, Helvetica, sans-serif; fill: #526158; }
      .zone-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #324138; letter-spacing: 0.5px; }
      .card-title { font: 700 26px Arial, Helvetica, sans-serif; fill: #172019; }
      .card-subtitle { font: 700 17px Arial, Helvetica, sans-serif; fill: #526158; letter-spacing: 0.6px; }
      .body { font: 400 18px Arial, Helvetica, sans-serif; fill: #2c3931; }
      .body-strong { font: 700 18px Arial, Helvetica, sans-serif; fill: #172019; }
      .small { font: 400 16px Arial, Helvetica, sans-serif; fill: #526158; }
      .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #425149; letter-spacing: 0.5px; }
      .step { font: 700 18px Arial, Helvetica, sans-serif; fill: #172019; }
      .footer { font: 700 18px Arial, Helvetica, sans-serif; fill: #26352b; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f4f7f5"/>
  <rect x="0" y="0" width="20" height="1080" fill="#76b900"/>

  <text class="title" x="72" y="70">AI Agents for Chemistry</text>
  <text class="subtitle" x="72" y="110">How a bounded Nemotron agent invokes nvMolKit GPU chemistry in a Brev Jupyter launchable</text>

  <!-- Hosted inference is intentionally outside the Brev runtime boundary. -->
  <g filter="url(#shadow)">
    <rect x="650" y="142" width="620" height="172" rx="22" fill="#e9f4fb" stroke="#72a9cc" stroke-width="2"/>
  </g>
  <rect x="682" y="166" width="184" height="30" rx="15" fill="#2472a4"/>
  <text x="774" y="187" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">HOSTED INFERENCE</text>
  <text class="card-title" x="682" y="232">Nemotron agent</text>
  <text class="body" x="682" y="264">Plans the workflow, selects bounded parameters, and emits structured tool calls.</text>
  <text class="body-strong" x="682" y="292">It does not execute GPU code.</text>

  <!-- Brev runtime boundary. -->
  <rect x="64" y="354" width="1792" height="642" rx="28" fill="#ffffff" stroke="#9eaaa3" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="96" y="334" width="350" height="42" rx="21" fill="#24332a"/>
  <text x="271" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff">BREV LAUNCHABLE · NVIDIA L4</text>

  <!-- Jupyter/Python controller. -->
  <g filter="url(#shadow)">
    <rect x="112" y="416" width="500" height="278" rx="22" fill="#ffffff" stroke="#b9c4bd" stroke-width="2"/>
  </g>
  <rect x="112" y="416" width="12" height="278" rx="6" fill="#2472a4"/>
  <text class="card-subtitle" x="150" y="454">JUPYTERLAB · CPYTHON 3.12</text>
  <text class="card-title" x="150" y="492">Python agent controller</text>
  <circle cx="157" cy="535" r="5" fill="#2472a4"/>
  <text class="body" x="174" y="541">Sends the user goal and bundled nvMolKit skill</text>
  <circle cx="157" cy="574" r="5" fill="#2472a4"/>
  <text class="body" x="174" y="580">Maintains one persistent Nemotron conversation</text>
  <circle cx="157" cy="613" r="5" fill="#2472a4"/>
  <text class="body" x="174" y="619">Validates calls with schemas and fixed phase gates</text>
  <circle cx="157" cy="652" r="5" fill="#2472a4"/>
  <text class="body" x="174" y="658">Executes approved calls and returns structured results</text>

  <!-- nvMolKit GPU tool chain. -->
  <g filter="url(#shadow)">
    <rect x="724" y="416" width="670" height="466" rx="22" fill="#f2f8ed" stroke="#76b900" stroke-width="3"/>
  </g>
  <rect x="756" y="440" width="176" height="30" rx="15" fill="#4b8f18"/>
  <text x="844" y="461" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff">GPU CHEMISTRY</text>
  <text class="card-title" x="756" y="506">nvMolKit on NVIDIA L4</text>
  <text class="small" x="756" y="535">Python invokes each operation in the validated sequence.</text>

  <g>
    <rect x="756" y="564" width="606" height="50" rx="12" fill="#ffffff" stroke="#c5d9b8"/>
    <circle cx="784" cy="589" r="16" fill="#76b900"/>
    <text x="784" y="595" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#172019">1</text>
    <text class="step" x="814" y="595">MorganFingerprintGenerator</text>

    <rect x="756" y="626" width="606" height="50" rx="12" fill="#ffffff" stroke="#c5d9b8"/>
    <circle cx="784" cy="651" r="16" fill="#76b900"/>
    <text x="784" y="657" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#172019">2</text>
    <text class="step" x="814" y="657">crossTanimotoSimilarity</text>

    <rect x="756" y="688" width="606" height="50" rx="12" fill="#ffffff" stroke="#c5d9b8"/>
    <circle cx="784" cy="713" r="16" fill="#76b900"/>
    <text x="784" y="719" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#172019">3</text>
    <text class="step" x="814" y="719">fused_butina</text>

    <rect x="756" y="750" width="606" height="50" rx="12" fill="#ffffff" stroke="#c5d9b8"/>
    <circle cx="784" cy="775" r="16" fill="#76b900"/>
    <text x="784" y="781" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#172019">4</text>
    <text class="step" x="814" y="781">EmbedMolecules</text>

    <rect x="756" y="812" width="606" height="50" rx="12" fill="#ffffff" stroke="#c5d9b8"/>
    <circle cx="784" cy="837" r="16" fill="#76b900"/>
    <text x="784" y="843" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#172019">5</text>
    <text class="step" x="814" y="843">MMFFOptimizeMoleculesConfs</text>
  </g>

  <!-- Notebook output. -->
  <g filter="url(#shadow)">
    <rect x="1506" y="416" width="302" height="278" rx="22" fill="#ffffff" stroke="#b9c4bd" stroke-width="2"/>
  </g>
  <rect x="1506" y="416" width="12" height="278" rx="6" fill="#76b900"/>
  <text class="card-subtitle" x="1544" y="454">NOTEBOOK OUTPUT</text>
  <text class="card-title" x="1544" y="492">Results</text>
  <circle cx="1551" cy="535" r="5" fill="#4b8f18"/>
  <text class="body" x="1568" y="541">Structured metrics</text>
  <circle cx="1551" cy="574" r="5" fill="#4b8f18"/>
  <text class="body" x="1568" y="580">Tables and figures</text>
  <circle cx="1551" cy="613" r="5" fill="#4b8f18"/>
  <text class="body" x="1568" y="619">Optimized conformers</text>
  <circle cx="1551" cy="652" r="5" fill="#4b8f18"/>
  <text class="body" x="1568" y="658">Checked final synthesis</text>

  <!-- RDKit support role. -->
  <g filter="url(#shadow)">
    <rect x="112" y="754" width="500" height="128" rx="20" fill="#f7f7f4" stroke="#b9c4bd" stroke-width="2"/>
  </g>
  <text class="card-title" x="150" y="796">RDKit support</text>
  <text class="body" x="150" y="829">Parse/sanitize SMILES · MMFF94 eligibility support</text>
  <text class="body" x="150" y="860">Representative handling · 2D/3D rendering</text>

  <!-- Main data and control flow. -->
  <path d="M 612 506 C 655 506, 675 506, 724 506" fill="none" stroke="#24332a" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text class="label" x="669" y="490" text-anchor="middle">VALIDATED INVOCATION</text>

  <path d="M 1394 552 C 1435 552, 1460 552, 1506 552" fill="none" stroke="#4b8f18" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text class="label" x="1450" y="535" text-anchor="middle">RENDER</text>

  <path d="M 415 416 C 415 350, 545 276, 650 244" fill="none" stroke="#2472a4" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text class="label" x="458" y="333">GOAL · SKILL · TOOL RESULTS</text>

  <path d="M 805 314 C 760 340, 685 375, 612 470" fill="none" stroke="#2472a4" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text class="label" x="662" y="376">PLAN · BOUNDED TOOL CALLS</text>

  <path d="M 724 700 C 680 700, 653 668, 612 652" fill="none" stroke="#607067" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text class="label" x="671" y="727" text-anchor="middle">STRUCTURED RESULTS</text>

  <path d="M 724 904 C 660 904, 630 876, 612 840" fill="none" stroke="#607067" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text class="label" x="673" y="930" text-anchor="middle">LOCAL SUPPORT</text>

  <path d="M 1394 720 C 1468 720, 1484 690, 1506 650" fill="none" stroke="#4b8f18" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text class="label" x="1451" y="747" text-anchor="middle">RESULTS</text>

  <!-- Input and feedback labels. -->
  <rect x="112" y="914" width="1696" height="50" rx="12" fill="#eaf0ec"/>
  <text class="footer" x="960" y="946" text-anchor="middle">Bounded autonomy: Nemotron chooses within validated limits; Python controls execution order, schemas, secrets, and GPU access.</text>

  <g transform="translate(72 1037)">
    <circle cx="0" cy="0" r="6" fill="#2472a4"/>
    <text class="small" x="14" y="6">Hosted agent interaction</text>
    <circle cx="245" cy="0" r="6" fill="#76b900"/>
    <text class="small" x="259" y="6">nvMolKit GPU chemistry</text>
    <circle cx="500" cy="0" r="6" fill="#607067"/>
    <text class="small" x="514" y="6">Local orchestration and support</text>
  </g>
</svg>
